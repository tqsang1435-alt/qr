<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="description" content="Trang xem ảnh trực tuyến nhanh và mượt mà.">
  <title>Xem Ảnh</title>

  <!-- Preload tất cả 3 ảnh để chuyển đổi tức thì không bị giật lag -->
  <link rel="preload" as="image" href="./images/1791898231072_3171001516605911240_3171001516605911240_7f66056724889276ea3441aaa06b3900.jpg">
  <link rel="preload" as="image" href="./images/1791898563701_3171001516605911240_3171001516605911240_a0c685435ddda7ef3c9cce7b7dd8e2e4.jpg">
  <link rel="preload" as="image" href="./images/1791898566249_3171001516605911240_3171001516605911240_fa0b303c51eea026926571c112e0c1de.jpg">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0a0a0a;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      touch-action: pan-y pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Container chính chiếm trọn màn hình, hỗ trợ Dynamic Viewport Height (dvh) */
    .viewer-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    /* Vùng chứa các ảnh */
    .slides-wrapper {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      pointer-events: none;
      padding: 16px;
    }

    .slide.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .slide img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    /* Chỉ báo số thứ tự ảnh ở phía trên */
    .counter-badge {
      position: absolute;
      top: max(18px, env(safe-area-inset-top) + 12px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      background: rgba(20, 20, 20, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.9);
      padding: 6px 16px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 1px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      pointer-events: none;
    }

    /* Nút bấm chuyển ảnh Prev / Next */
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 20;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(24, 24, 24, 0.6);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      outline: none;
      transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .nav-btn:hover {
      background: rgba(45, 45, 45, 0.85);
      border-color: rgba(255, 255, 255, 0.3);
      transform: translateY(-50%) scale(1.06);
    }

    .nav-btn:active {
      transform: translateY(-50%) scale(0.94);
    }

    .nav-btn-prev {
      left: max(14px, env(safe-area-inset-left) + 8px);
    }

    .nav-btn-next {
      right: max(14px, env(safe-area-inset-right) + 8px);
    }

    .nav-btn svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }

    /* Thanh chỉ báo chấm (Dots) ở phía dưới */
    .dots-container {
      position: absolute;
      bottom: max(22px, env(safe-area-inset-bottom) + 14px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(20, 20, 20, 0.55);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    }

    .dot {
      position: relative;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      border: none;
      cursor: pointer;
      outline: none;
      padding: 0;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Tăng diện tích chạm (hit area) cho ngón tay trên điện thoại */
    .dot::after {
      content: '';
      position: absolute;
      top: -12px;
      bottom: -12px;
      left: -10px;
      right: -10px;
    }

    .dot.active {
      width: 22px;
      border-radius: 6px;
      background: #ffffff;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    /* Tối ưu cho thiết bị di động */
    @media (max-width: 600px) {
      .slide {
        padding: 8px;
      }

      .nav-btn {
        width: 44px;
        height: 44px;
        background: rgba(20, 20, 20, 0.5);
      }

      .nav-btn svg {
        width: 20px;
        height: 20px;
      }

      .counter-badge {
        font-size: 13px;
        padding: 5px 14px;
      }

      .dots-container {
        gap: 8px;
        padding: 6px 12px;
      }
    }
  </style>
</head>
<body>

  <main class="viewer-container" id="viewer" aria-label="Bộ sưu tập ảnh">
    <!-- Hiển thị số thứ tự ảnh -->
    <div class="counter-badge" aria-live="polite">
      <span id="current-idx">1</span> / <span id="total-idx">3</span>
    </div>

    <!-- Nút xem ảnh trước -->
    <button class="nav-btn nav-btn-prev" id="btn-prev" aria-label="Ảnh trước (Mũi tên trái)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <!-- Nút xem ảnh tiếp theo -->
    <button class="nav-btn nav-btn-next" id="btn-next" aria-label="Ảnh tiếp theo (Mũi tên phải)">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>

    <!-- Danh sách các ảnh -->
    <div class="slides-wrapper" id="slides-wrapper">
      <div class="slide active" data-index="0">
        <img 
          src="./images/1791898231072_3171001516605911240_3171001516605911240_7f66056724889276ea3441aaa06b3900.jpg" 
          alt="Bức ảnh số 1"
          fetchpriority="high"
        >
      </div>
      <div class="slide" data-index="1">
        <img 
          src="./images/1791898563701_3171001516605911240_3171001516605911240_a0c685435ddda7ef3c9cce7b7dd8e2e4.jpg" 
          alt="Bức ảnh số 2"
          loading="eager"
        >
      </div>
      <div class="slide" data-index="2">
        <img 
          src="./images/1791898566249_3171001516605911240_3171001516605911240_fa0b303c51eea026926571c112e0c1de.jpg" 
          alt="Bức ảnh số 3"
          loading="eager"
        >
      </div>
    </div>

    <!-- Chỉ báo 3 chấm -->
    <nav class="dots-container" aria-label="Chọn ảnh">
      <button class="dot active" data-target="0" aria-label="Xem ảnh 1"></button>
      <button class="dot" data-target="1" aria-label="Xem ảnh 2"></button>
      <button class="dot" data-target="2" aria-label="Xem ảnh 3"></button>
    </nav>
  </main>

  <script>
    (function () {
      'use strict';

      const slides = document.querySelectorAll('.slide');
      const dots = document.querySelectorAll('.dot');
      const currentIdxText = document.getElementById('current-idx');
      const totalIdxText = document.getElementById('total-idx');
      const btnPrev = document.getElementById('btn-prev');
      const btnNext = document.getElementById('btn-next');
      const viewer = document.getElementById('viewer');

      const totalSlides = slides.length;
      totalIdxText.textContent = totalSlides;

      let currentIndex = 0;

      // Hàm chuyển tới ảnh thứ index
      function goToSlide(index) {
        // Hỗ trợ vòng lặp (looping)
        if (index < 0) {
          currentIndex = totalSlides - 1;
        } else if (index >= totalSlides) {
          currentIndex = 0;
        } else {
          currentIndex = index;
        }

        // Cập nhật trạng thái hiển thị của các slide
        slides.forEach((slide, i) => {
          if (i === currentIndex) {
            slide.classList.add('active');
          } else {
            slide.classList.remove('active');
          }
        });

        // Cập nhật dots
        dots.forEach((dot, i) => {
          if (i === currentIndex) {
            dot.classList.add('active');
            dot.setAttribute('aria-current', 'true');
          } else {
            dot.classList.remove('active');
            dot.removeAttribute('aria-current');
          }
        });

        // Cập nhật số thứ tự
        currentIdxText.textContent = currentIndex + 1;
      }

      function nextSlide() {
        goToSlide(currentIndex + 1);
      }

      function prevSlide() {
        goToSlide(currentIndex - 1);
      }

      // 1. Sự kiện bấm nút Next / Prev
      btnNext.addEventListener('click', (e) => {
        e.stopPropagation();
        nextSlide();
      });

      btnPrev.addEventListener('click', (e) => {
        e.stopPropagation();
        prevSlide();
      });

      // 2. Sự kiện bấm vào các chấm (dots)
      dots.forEach((dot) => {
        dot.addEventListener('click', (e) => {
          e.stopPropagation();
          const targetIndex = parseInt(dot.getAttribute('data-target'), 10);
          goToSlide(targetIndex);
        });
      });

      // 3. Sự kiện điều khiển bằng bàn phím (mũi tên trái / phải)
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Right') {
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'Left') {
          prevSlide();
        } else if (e.key === '1') {
          goToSlide(0);
        } else if (e.key === '2') {
          goToSlide(1);
        } else if (e.key === '3') {
          goToSlide(2);
        }
      });

      // 4. Xử lý thao tác vuốt (Swipe) trên màn hình cảm ứng điện thoại
      let touchStartX = 0;
      let touchStartY = 0;
      let touchEndX = 0;
      let touchEndY = 0;
      const minSwipeDistance = 45; // Ngưỡng pixel để kích hoạt vuốt

      viewer.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchEndX = touchStartX;
          touchEndY = touchStartY;
        }
      }, { passive: true });

      viewer.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          touchEndX = e.touches[0].clientX;
          touchEndY = e.touches[0].clientY;
        }
      }, { passive: true });

      viewer.addEventListener('touchend', () => {
        const deltaX = touchEndX - touchStartX;
        const deltaY = touchEndY - touchStartY;

        // Chỉ nhận diện thao tác vuốt ngang khi khoảng cách di chuyển ngang lớn hơn dọc
        if (Math.abs(deltaX) > minSwipeDistance && Math.abs(deltaX) > Math.abs(deltaY) * 1.2) {
          if (deltaX < 0) {
            // Vuốt sang trái -> Ảnh tiếp theo
            nextSlide();
          } else {
            // Vuốt sang phải -> Ảnh trước
            prevSlide();
          }
        }
      }, { passive: true });

    })();
  </script>
</body>
</html>
